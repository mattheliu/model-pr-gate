name: Model PR Gate
description: Verify a minimal signed model proof offline. No session uploads or third-party service.
author: mattheliu
branding:
  icon: shield
  color: green
inputs:
  trusted-keys:
    description: JSON object mapping trusted issuer names to Ed25519 public PEM keys. Configure outside PR control.
    required: true
  allowed-models:
    description: Optional exact IDs, one per line. Defaults to gpt-6-astra and claude-fable-5-1.
    required: false
  language:
    description: Human messages, en or zh-CN. Machine outputs remain stable.
    default: en
  mode:
    description: enforce fails on rejected or missing proofs; report returns the result without blocking
    default: enforce
outputs:
  verdict:
    description: verified, rejected, or unverified
    value: ${{ steps.proof.outputs.verdict }}
  reason:
    description: Fixed machine-readable reason, without private input values
    value: ${{ steps.proof.outputs.reason }}
  evidence-level:
    description: trusted-issuer if verified, otherwise none
    value: ${{ steps.proof.outputs.evidence-level }}
runs:
  using: composite
  steps:
    - name: Verify model proof offline
      id: proof
      shell: bash
      env:
        MODEL_GATE_TRUSTED_KEYS: ${{ inputs.trusted-keys }}
        MODEL_GATE_ALLOWED: ${{ inputs.allowed-models }}
        MODEL_GATE_LANGUAGE: ${{ inputs.language }}
        MODEL_GATE_MODE: ${{ inputs.mode }}
      run: node "$GITHUB_ACTION_PATH/bin/verify-action.js"
